name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portable-filenames:
    name: Windows-safe tracked file names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on paths Windows cannot check out
        # A backlog file with `"` and `:` in its name made
        # `git pull` fail for every Windows user. Reject <>:"\|?* , a trailing
        # space or dot, and reserved device names in any tracked path.
        run: |
          bad="$(git -c core.quotepath=off ls-files | grep -E '[<>:"\\|?*]|[ .]$|(^|/)(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\.[^/]*)?(/|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Tracked paths that Windows cannot create:"
            echo "$bad"
            exit 1
          fi
          echo "All tracked paths are Windows-safe."

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Dry-run publish (catches pubspec & lint issues)
        run: flutter pub publish --dry-run
